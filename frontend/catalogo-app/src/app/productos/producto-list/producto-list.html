<h2>Listado de productos</h2>

<div *ngIf="error" style="color:red">
  {{ error }}
</div>

<table border="1" *ngIf="productos.length">
  <tr>
    <th>Nombre</th>
    <th>Precio</th>
    <th>Stock</th>
    <th>Acciones</th>
  </tr>

  <tr *ngFor="let p of productos">
    <td>{{ p.nombre }}</td>
    <td>{{ p.precio }}</td>
    <td>{{ p.stock }}</td>
    <td>
      <button (click)="editar(p)">Editar</button>
      <button (click)="eliminar(p.id)">Eliminar</button>
    </td>
  </tr>
</table>
