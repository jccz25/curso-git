<div class="card mt-4 shadow-sm">

  <div class="card-header bg-secondary text-white">
    <strong>Listado de Productos</strong>
  </div>

  <div class="card-body">

    <table class="table table-striped table-hover">

      <thead>
        <tr>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Stock</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let p of productos">
          <td>{{ p.nombre }}</td>
          <td>{{ p.precio }}</td>
          <td>{{ p.stock }}</td>
        </tr>
      </tbody>

    </table>

  </div>
</div>
